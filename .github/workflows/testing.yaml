# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    # The read permissions of design section 9.4 for a single repository.
    permissions:
      actions: read # workflow runs
      checks: read # job counts from check suites
      contents: read
      issues: read # issues and their events
      pull-requests: read # pull requests and their reviews
    timeout-minutes: 20
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Collect, render and build the site for this repository alone,
      # from the checked-out source, on a budget the job can afford.
      - name: "Running local action: ${{ github.repository }}"
        id: statistics
        uses: $/
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          use_local_source: "true"
          budget: "200"
          output_dir: site

      - name: "Validate the site"
        shell: bash
        env:
          SITE_DIR: ${{ steps.statistics.outputs.site_dir }}
          REQUESTS_USED: ${{ steps.statistics.outputs.requests_used }}
        run: |
          # Validate the site
          if [ ! -f site/index.html ]; then
            echo "Error: site/index.html is missing ❌"
            exit 1
          fi
          echo "Site: $SITE_DIR, requests used: $REQUESTS_USED ✅"

      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: github-statistics-site
          path: site/
          if-no-files-found: error

      - name: "Running local action: ${{ github.repository }} [scope]"
        id: scope
        uses: $/
        with:
          command: scope
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          use_local_source: "true"

      - name: "Validate the scope"
        shell: bash
        env:
          REPOSITORY_COUNT: ${{ steps.scope.outputs.repository_count }}
          REPOSITORIES: ${{ steps.scope.outputs.repositories }}
        run: |
          # Validate the scope
          if [ "$REPOSITORY_COUNT" != "1" ]; then
            echo "Error: expected 1 repository, got '$REPOSITORY_COUNT' ❌"
            exit 1
          fi
          echo "Scope: $REPOSITORIES ✅"
