# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Runs on a pull request: builds, tests and audits the Python package.
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master
    paths:
      - '**'
      - '!.github/**'
      - '!.*'
      - '!tox.ini'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  build-test:
    permissions:
      contents: read  # Check out the repository to build and test.
      pull-requests: read  # Read PR metadata for status reporting.
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/python-workflows/.github/workflows/build-test.yaml@93610919c6ca8ef89408ef1abb385e416bb7fc40  # v0.8.2
